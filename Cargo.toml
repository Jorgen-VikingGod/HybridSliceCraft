[package]
name = "hybridslicecraft"
version = "0.1.0"
edition = "2021"
authors = ["Jürgen Könnemann"]
description = "Hybrid slicer for filament (FDM) and resin (MSLA) 3D printers"

[[bin]]
name = "hybridslicecraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui-wgpu = "0.37"
egui = "0.37"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
clipper2-rust = "1.2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
pollster = "0.4"
ahash = "0.8"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
