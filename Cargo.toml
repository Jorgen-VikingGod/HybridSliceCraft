[package]
name = "hybridslicecraft"
version = "0.22.0"
edition = "2021"
authors = ["Jürgen Könnemann"]
license = "MIT"
description = "Hybrid slicer for filament (FDM) and resin (MSLA) 3D printers"

[[bin]]
name = "hybridslicecraft"
path = "src/main.rs"

# Installers for Windows (.msi), macOS (.dmg) and Linux (.deb, .AppImage),
# made with cargo-packager. The release workflow on GitHub runs this.
[package.metadata.packager]
product-name = "HybridSliceCraft"
identifier = "io.github.jorgen-vikinggod.hybridslicecraft"
authors = ["Jürgen Könnemann"]
publisher = "Jürgen Könnemann"
copyright = "Copyright © Jürgen Könnemann"
description = "Hybrid slicer for filament (FDM) and resin (MSLA) 3D printers"
homepage = "https://github.com/Jorgen-VikingGod/HybridSliceCraft"
category = "GraphicsAndDesign"
out-dir = "dist"
before-packaging-command = "cargo build --release --locked"
binaries = [{ path = "hybridslicecraft", main = true }]
icons = ["assets/icon.ico", "assets/icon-512@2x.png", "assets/icon-512.png", "assets/icon-256.png", "assets/icon-128.png", "assets/icon-32.png"]

# The window library loads these when it starts, so the AppImage tool can't see that they
# are needed. Without them the program won't start on a system that lacks one.
[package.metadata.packager.appimage]
libs = [
  "libxkbcommon.so.0",
  "libxkbcommon-x11.so.0",
  "libxcb-xkb.so.1",
  "libXcursor.so.1",
  "libXi.so.6",
  "libXrandr.so.2",
  "libXrender.so.1",
]

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libwayland-client0", "libvulkan1 | libgl1"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui-wgpu = "0.37"
# Without this the system clipboard is off, and nothing copied elsewhere can be pasted.
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
# `experimental`: the widget theme hook, for the outline of a selected row (theme.rs).
egui = { version = "0.37", features = ["experimental"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
clipper2-rust = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading PNGs (the window icon, tests); writing goes through craft-png.
png = "0.18"
pollster = "0.4"
ahash = "0.8"
# Checking for and downloading new versions (HTTPS through rustls, no system libraries).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# STEP files (Apache-2.0): read the solid's faces and cut them into triangles.
truck-stepio = "0.3"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "filters", "tessellation"] }
truck-topology = "0.6"
ruststep = "0.4"

# Shared Craft libraries (MIT OR Apache-2.0), pinned to one commit of
# https://github.com/storytold/craft-libs. Update every pin together, and keep the
# [patch.crates-io] revisions at the bottom the same as craft-libs' own at that commit.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-png = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", default-features = false, features = ["stl", "obj", "ply", "gltf", "fbx"] }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-sniff = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["egui"] }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-platform = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["appearance"] }
craft-automation = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }

[dev-dependencies]
truck-modeling = "0.6"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The craft libraries are built on storytold's egui and winit forks, and an app must take every egui
# crate from the same revision. Keep these revisions the same as the root `Cargo.toml` of
# craft-libs at the pinned commit.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
