[package]
name = "hybridslicecraft"
version = "0.12.0"
edition = "2021"
authors = ["Jürgen Könnemann"]
license = "MIT"
description = "Hybrid slicer for filament (FDM) and resin (MSLA) 3D printers"

[[bin]]
name = "hybridslicecraft"
path = "src/main.rs"

# Installers for Windows (.msi), macOS (.dmg) and Linux (.deb, .AppImage),
# made with cargo-packager. The release workflow on GitHub runs this.
[package.metadata.packager]
product-name = "HybridSliceCraft"
identifier = "io.github.jorgen-vikinggod.hybridslicecraft"
authors = ["Jürgen Könnemann"]
publisher = "Jürgen Könnemann"
copyright = "Copyright © Jürgen Könnemann"
description = "Hybrid slicer for filament (FDM) and resin (MSLA) 3D printers"
homepage = "https://github.com/Jorgen-VikingGod/HybridSliceCraft"
category = "GraphicsAndDesign"
out-dir = "dist"
before-packaging-command = "cargo build --release --locked"
binaries = [{ path = "hybridslicecraft", main = true }]
icons = ["assets/icon.ico", "assets/icon-512@2x.png", "assets/icon-512.png", "assets/icon-256.png", "assets/icon-128.png", "assets/icon-32.png"]

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libwayland-client0", "libvulkan1 | libgl1"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui-wgpu = "0.37"
# Without this the system clipboard is off, and nothing copied elsewhere can be pasted.
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
egui = "0.37"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
clipper2-rust = "1.2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
pollster = "0.4"
ahash = "0.8"
# STEP files (Apache-2.0): read the solid's faces and cut them into triangles.
truck-stepio = "0.3"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "filters", "tessellation"] }
truck-topology = "0.6"
ruststep = "0.4"

[dev-dependencies]
truck-modeling = "0.6"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
