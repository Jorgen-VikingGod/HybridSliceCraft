# Flatpak manifest, for Flathub.
#
# Flathub builds without a network, so every Rust crate is listed in
# cargo-sources.json. Make that file from Cargo.lock whenever it changes:
#   ./packaging/flatpak/update-cargo-sources.sh
#
# Build and try it here:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.jorgen_vikinggod.HybridSliceCraft.yml
#   flatpak run io.github.jorgen_vikinggod.HybridSliceCraft
app-id: io.github.jorgen_vikinggod.HybridSliceCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hybridslicecraft

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The 3D view and the resin layers draw on the graphics card.
  - --device=dri
  # Sending prints to OctoPrint or Moonraker on the local network.
  - --share=network
  # Files are opened and saved through the file chooser portal, so no folder access is needed.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/hybridslicecraft/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: hybridslicecraft
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/hybridslicecraft /app/bin/hybridslicecraft
      - install -Dm644 packaging/flatpak/io.github.jorgen_vikinggod.HybridSliceCraft.desktop /app/share/applications/io.github.jorgen_vikinggod.HybridSliceCraft.desktop
      - install -Dm644 packaging/flatpak/io.github.jorgen_vikinggod.HybridSliceCraft.metainfo.xml /app/share/metainfo/io.github.jorgen_vikinggod.HybridSliceCraft.metainfo.xml
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.jorgen_vikinggod.HybridSliceCraft.png
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.jorgen_vikinggod.HybridSliceCraft.png
      - install -Dm644 assets/icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.jorgen_vikinggod.HybridSliceCraft.png
      - install -Dm644 assets/icon-32.png /app/share/icons/hicolor/32x32/apps/io.github.jorgen_vikinggod.HybridSliceCraft.png
    sources:
      - type: git
        url: https://github.com/Jorgen-VikingGod/HybridSliceCraft.git
        tag: v0.4.0
        commit: ebf94ecfd112fc0774cf247d8ea5ab197a13b6b6
      - cargo-sources.json
