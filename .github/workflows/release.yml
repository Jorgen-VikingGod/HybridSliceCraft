# Builds installers for every platform when a release is published on GitHub,
# and attaches them to that release:
#   Windows .msi, macOS .dmg (Apple silicon and Intel), Linux .deb and .AppImage
#
# It can also be started by hand from the Actions tab ("Run workflow"); then
# the installers are kept as downloadable build artifacts instead.
#
# Signing (see docs/distribution.md). Each part is skipped with a warning while
# its secrets are missing, so the installers are then built unsigned:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD,
#            or Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#            AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_CERT_PROFILE
#   macOS:   APPLE_CERTIFICATE (base64 .p12) and APPLE_CERTIFICATE_PASSWORD
#            (KEYCHAIN_PASSWORD optional); for notarization also APPLE_ID,
#            APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID
#   Linux:   LINUX_SIGNING_KEY (OpenPGP key or subkey without a passphrase) signs
#            the .deb, AppImage and .zsync (.asc files) and SHA256SUMS.txt
# The signing steps come from storytold/craft-common-actions, pinned to a commit.

name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PACKAGER_VERSION: 0.11.8

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (msi)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: -f wix
          - name: macOS Apple silicon (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
            formats: -f dmg
          - name: macOS Intel (dmg)
            os: macos-latest
            target: x86_64-apple-darwin
            formats: -f dmg
          - name: Linux (deb, AppImage)
            # The oldest supported Ubuntu, so the program runs on older systems too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: -f deb -f appimage
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # Whether Windows signing secrets exist ("true"/"false" only): the signature check
      # below runs only then. Secrets can't be read in a step's `if`.
      WINDOWS_SIGNING_SET: ${{ (secrets.WINDOWS_CERTIFICATE != '' || secrets.AZURE_CLIENT_SECRET != '') && 'true' || 'false' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the version from the release tag
        if: github.event_name == 'release' || github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Only the first version line: the package's own, near the top.
            # perl behaves the same on Linux, macOS and Windows build machines.
            perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$tag\"/m" Cargo.toml
            echo "Packaging version $tag"
          else
            echo "Tag '$GITHUB_REF_NAME' isn't a plain version like v1.2.3; keeping the version in Cargo.toml"
          fi

      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-xkb1

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.PACKAGER_VERSION }}

      - name: Keep the lock file in step with the version
        run: cargo update --workspace

      - name: Run the tests
        # Tests run on the machine itself, so skip them when building for another chip.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked

      - name: Set up Windows signing
        if: runner.os == 'Windows'
        uses: storytold/craft-common-actions/actions/setup-windows-signing@3dee18226ed28134896f69fb8b280fff9247ec7f # main, 2026-11-19
        with:
          product-name: HybridSliceCraft

      - name: Let cargo-packager sign on Windows
        # cargo-packager runs this on the program before it builds the .msi, then on the .msi,
        # with %1 replaced by the file. The script signs with whichever secrets are set, or
        # warns and leaves the files unsigned.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # cargo-packager splits the command at spaces, so the path must have none.
          if ($env:CRAFT_SIGN_SCRIPT -match '\s') { throw "The signing script's path contains a space: $env:CRAFT_SIGN_SCRIPT" }
          "`n[package.metadata.packager.windows]`nsign-command = 'pwsh -NoProfile -NonInteractive -File $env:CRAFT_SIGN_SCRIPT %1'`n" | Add-Content -Path Cargo.toml
          Get-Content Cargo.toml -Tail 3
          # cargo-packager keeps the script's own output to itself, so warn here.
          if ($env:WINDOWS_SIGNING_SET -ne 'true') { Write-Output "::warning::No Windows signing secrets (WINDOWS_CERTIFICATE or AZURE_*): the program and the .msi stay unsigned." }

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        uses: storytold/craft-common-actions/actions/import-macos-certificate@3dee18226ed28134896f69fb8b280fff9247ec7f # main, 2026-11-19
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Let cargo-packager sign on macOS
        # With an identity, cargo-packager signs the app (hardened runtime, timestamp) and the
        # .dmg, and notarizes the app when APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are set.
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        shell: bash
        run: printf '\n[package.metadata.packager.macos]\nsigning-identity = "%s"\n' "$MACOS_SIGN_IDENTITY" >> Cargo.toml

      - name: Build installers
        shell: bash
        env:
          # The AppImage tools run without needing FUSE on the build machine.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Each signing secret reaches only the build machine that uses it.
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE: ${{ runner.os == 'Windows' && secrets.AZURE_CERT_PROFILE || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: cargo packager --release ${{ matrix.formats }} --target ${{ matrix.target }}

      - name: Check the Windows signatures
        # Only when signing secrets are set; otherwise the files are unsigned on purpose.
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_SET == 'true'
        shell: pwsh
        run: |
          foreach ($f in @(Get-ChildItem dist/*.msi) + @(Get-Item target/${{ matrix.target }}/release/hybridslicecraft.exe)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Output "$($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      - name: Make the AppImage usable by every user
        # cargo-packager leaves the files inside the AppImage readable and runnable by their
        # owner only (the build folder is private), so another user, or a sandbox such as the
        # one the AppImage catalogue tests in, gets "Permission denied" on AppRun. Unpack it,
        # open the permissions and pack it again.
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          # https://docs.appimage.org/packaging-guide/optional/updates.html
          UPDATE_INFO: gh-releases-zsync|Jorgen-VikingGod|HybridSliceCraft|latest|hybridslicecraft_*_x86_64.AppImage.zsync
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          cd dist
          for f in *.AppImage; do
            chmod +x "$f"
            "./$f" --appimage-extract >/dev/null
            chmod -R u+rwX,go+rX squashfs-root
            chmod 755 squashfs-root/AppRun
            # Pack it under its own name, so the .zsync file names it correctly, and embed
            # where updates come from: AppImageUpdate then fetches only what changed.
            mv "$f" "$RUNNER_TEMP/$f.orig"
            "$RUNNER_TEMP/appimagetool" -u "$UPDATE_INFO" squashfs-root "$f"
            rm -f "$RUNNER_TEMP/$f.orig"
            chmod 755 "$f"
            [ -s "$f.zsync" ] || { echo "No .zsync file was made" >&2; exit 1; }
            objcopy --dump-section .upd_info="$RUNNER_TEMP/upd_info" "$f" "$RUNNER_TEMP/elf.tmp"
            info=$(tr -d '\0' < "$RUNNER_TEMP/upd_info")
            [ "$info" = "$UPDATE_INFO" ] || { echo "Update information is '$info'" >&2; exit 1; }
            rm -rf squashfs-root
            "./$f" --appimage-extract >/dev/null
            # Check the result: no file inside may be closed to other users. (Folders are
            # skipped: the unpacking tool makes those private whatever the image says.)
            bad=$(find squashfs-root -type f \( ! -perm -o+r -o \( -perm -u+x ! -perm -o+x \) \))
            if [ -n "$bad" ]; then
              echo "$bad"
              echo "Some files in the AppImage are still closed to other users" >&2
              exit 1
            fi
            # The libraries the window code loads on its own must be inside.
            for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libXcursor.so.1 libXi.so.6 libXrandr.so.2; do
              find squashfs-root/usr -name "$lib" | grep -q . || { echo "$lib is missing from the AppImage" >&2; find squashfs-root/usr -name "*.so*" >&2; exit 1; }
            done
            [ "$(stat -c %a squashfs-root/AppRun)" = 755 ] || { echo "AppRun is not 755" >&2; exit 1; }
            rm -rf squashfs-root
          done

      - name: Name the files by platform
        shell: bash
        run: |
          cd dist
          for f in *.msi *.dmg *.deb *.AppImage; do
            [ -e "$f" ] || continue
            case "$f" in
              *.dmg) mv "$f" "${f%.dmg}_${{ matrix.target }}.dmg" ;;
            esac
          done
          ls -la

      - name: Keep the installers with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

      - name: Attach the installers to the release
        if: github.event_name == 'release' || github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.msi dist/*.dmg dist/*.deb dist/*.AppImage dist/*.AppImage.zsync)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # A SHA256SUMS.txt of every installer, and OpenPGP signatures (.asc) for the Linux files and
  # the checksums, with LINUX_SIGNING_KEY (a signing key or subkey without a passphrase; see
  # docs/distribution.md). Without the key the checksums are still made, unsigned.
  # The .flatpak comes later from its own workflow, so it isn't in the list.
  checksums:
    name: Checksums and Linux signatures
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Import the Linux signing key
        id: key
        uses: storytold/craft-common-actions/actions/import-signing-key@3dee18226ed28134896f69fb8b280fff9247ec7f # main, 2026-11-19
        with:
          key: ${{ secrets.LINUX_SIGNING_KEY }}

      - name: Sign and list the files
        shell: bash
        env:
          SIGNED: ${{ steps.key.outputs.enabled }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          if [ "$SIGNED" = true ]; then
            for f in *.deb *.AppImage *.AppImage.zsync; do
              gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o "$f.asc" "$f"
            done
            gpg --batch --armor --export "$SIGNING_FPR" > release-signing-key.asc
          else
            echo "::warning::LINUX_SIGNING_KEY isn't set: the Linux files and SHA256SUMS.txt are not signed."
          fi
          files=(*.msi *.dmg *.deb *.AppImage *.AppImage.zsync *.asc)
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          if [ "$SIGNED" = true ]; then
            gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
          ls -la

      - name: Keep them with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/SHA256SUMS.txt*
            dist/*.asc
          if-no-files-found: error

      - name: Attach them to the release
        if: github.event_name == 'release' || github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Each file once: gh uploads in parallel, and two uploads of one name with --clobber
          # delete each other (SHA256SUMS.txt.asc matched both SHA256SUMS.txt* and *.asc).
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.txt dist/*.asc --clobber --repo "$GITHUB_REPOSITORY"

  # Starts the AppImage the way the AppImage catalogue (appimage.github.io) tests it: a
  # fresh Ubuntu 22.04 without our build libraries, a small virtual screen with no graphics
  # card, and a sandbox with no network. The program must show a window within 30 seconds.
  appimage-test:
    name: AppImage start test
    needs: package
    runs-on: ubuntu-22.04
    env:
      DISPLAY: ":99"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-x86_64-unknown-linux-gnu
          path: dist

      - name: Test tools (as the catalogue installs them)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb icewm xdotool x11-utils imagemagick libgl1-mesa-dri mesa-utils libfuse2 firejail

      - name: Start the AppImage
        shell: bash
        run: |
          set -u
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          sleep 2
          icewm >/dev/null 2>&1 &
          sleep 2
          f=$(ls dist/*.AppImage | head -n 1)
          chmod +x "$f"
          mkdir -p "$HOME/.local/share/appimagekit" && touch "$HOME/.local/share/appimagekit/no_desktopintegration"
          firejail --quiet --noprofile --net=none --appimage "./$f" > app.log 2>&1 &
          pid=$!
          shown=""
          for i in $(seq 1 30); do
            kill -0 $pid 2>/dev/null || break
            if timeout 5 xdotool search --onlyvisible --name 'HybridSliceCraft' >/dev/null 2>&1; then shown=yes; break; fi
            sleep 1
          done
          sleep 3
          import -window root screen.png || true
          echo "----- program output -----"; cat app.log
          kill $pid 2>/dev/null || true
          if [ -z "$shown" ]; then
            echo "::error::The AppImage did not show a window within 30 seconds"
            exit 1
          fi
          echo "A window appeared after about $i seconds"

      - name: Keep the screen picture and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-test
          path: |
            screen.png
            app.log
